<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/patina.css' | relative_url }}">
</head>
<body>
<nav class="topnav">
  <a class="logo" href="{{ '/' | relative_url }}">Patina</a>
  <span>{% if site.data.listings.example %}Annunci di esempio{% else %}Scanner aggiornato {{ site.data.listings.updated }}{% endif %} · <a href="{{ '/mm/' | relative_url }}">Versione Minimal Mistakes</a></span>
</nav>
{{ content }}
<script>
window.PATINA = {
  base: "{{ '/' | relative_url }}",
  models: {{ site.data.models | jsonify }},
  sources: {{ site.data.sources | jsonify }},
  listings: {{ site.data.listings | jsonify }},
  photos: {{ site.data.photos | jsonify }}
};
</script>
<script src="{{ '/assets/js/patina.js' | relative_url }}"></script>
</body>
</html>
