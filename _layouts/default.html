<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/patina.css' | relative_url }}">
</head>
<body>
<nav class="topnav" aria-label="Menu principale">
  <a class="logo" href="{{ '/' | relative_url }}">Patina</a>
  <div class="navlinks">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Termometro</a>
    <a href="{{ '/orologi/' | relative_url }}"{% if page.url contains '/orologi/' %} aria-current="page"{% endif %}>Orologi</a>
    <a href="{{ '/guide/' | relative_url }}"{% if page.url contains '/guide/' or page.layout == 'post' %} aria-current="page"{% endif %}>Guide</a>
  </div>
  <div class="search" role="search">
    <label for="q" class="sr">Cerca</label>
    <input id="q" type="search" placeholder="Cerca orologio, referenza, guida…" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
</nav>
{{ content }}
<script>
window.PATINA = {
  base: "{{ '/' | relative_url }}",
  models: {{ site.data.models | jsonify }},
  sources: {{ site.data.sources | jsonify }},
  listings: {{ site.data.listings | jsonify }},
  photos: {{ site.data.photos | jsonify }},
  posts: [{% for p in site.posts %}{"t": {{ p.title | jsonify }}, "u": {{ p.url | relative_url | jsonify }}, "e": {{ p.excerpt | strip_html | strip_newlines | jsonify }}, "c": {{ p.content | strip_html | strip_newlines | truncatewords: 400 | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
};
</script>
<script src="{{ '/assets/js/patina.js' | relative_url }}"></script>
</body>
</html>
