name: Scanner

# Cerca gli annunci ogni 3 ore, salva i dati e poi ripubblica il sito.
# Le modifiche al sito NON passano più da qui: le pubblica il workflow "Sito".

on:
  schedule:
    - cron: "17 */3 * * *"     # annunci ogni 3 ore
  workflow_dispatch:
    inputs:
      photos:
        description: "Aggiorna anche le foto da Wikimedia Commons"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: patina-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt

      - name: Foto (lunedì, primo avvio o su richiesta)
        run: |
          if [ "${{ inputs.photos }}" = "true" ] || [ "$(date -u +%u%H)" = "100" ] || grep -q '\[\]' _data/photos.json; then
            cd scanner && python commons.py
          fi

      - name: Annunci
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: cd scanner && python scan.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "patina-bot"
          git config user.email "patina-bot@users.noreply.github.com"
          git add _data scanner/debug scanner/cache 2>/dev/null || git add _data
          if ! git diff --cached --quiet; then
            git commit -m "Dati scanner $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -q origin main
            git push
          fi

  sito:
    needs: scan
    uses: ./.github/workflows/site.yml
